[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-simulator-python"
version = "0.9.0"
description = "A Python rewrite of the Monte Carlo MLB simulator using public MLB data feeds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
]

[project.scripts]
mlb-sim = "mlb_simulator.cli:main"
mlb-league-averages = "mlb_simulator.league_averages:main"

[tool.setuptools]
packages = ["mlb_simulator"]
